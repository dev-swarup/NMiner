name: Build NMiner

on:
  push:
    branches: [ master ]

jobs:
  build:
    timeout-minutes: 20
    runs-on: ${{ matrix.config.os }}
    continue-on-error: ${{ matrix.config.experimental == true }}

    strategy:
      matrix:
        config:
          - { os: ubuntu-22.04,     name: linux, arch: x64,   node: 22, cmake_args: "" }
          - { os: ubuntu-22.04-arm, name: linux, arch: arm64, node: 22, cmake_args: "" }

          - { os: windows-latest, name: win32, arch: x64,   node: 22, cmake_args: "" }
          - { os: windows-11-arm, name: win32, arch: arm64, node: 22, cmake_args: "-A ARM64 -t ClangCL", experimental: true }
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js ${{ matrix.config.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.config.node }}

      - if: matrix.config.name == 'linux'
        name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git build-essential cmake python3

      - if: matrix.config.name == 'win32'
        name: Install Windows dependencies
        uses: microsoft/setup-msbuild@v3

      - name: Install & Build
        run: |
          npm install --ignore-scripts
          npm run tsc && npx cmake-js compile ${{ matrix.config.cmake_args }}

      - if: matrix.config.name == 'linux'
        name: Strip debug symbols
        run: |
          strip --strip-all build/Release/NMiner.node
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: addon-${{ matrix.config.name }}-${{ matrix.config.arch }}
          path: |
            index.js
            index.d.ts
            src/js/*.js
            src/js/*.d.ts
            build/Release/NMiner.node

  publish:
    name: Publish & Release
    needs: build
    runs-on: ubuntu-22.04

    if: startsWith(github.event.commits[0].message, 'Release:')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - id: pkg
        name: Read version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: ./temp

      - name: Compile TypeScript
        run: |
          npm install --ignore-scripts
          npm run tsc

      - name: Prepare Package
        run: |
          mkdir -p bin

          cp temp/addon-win32-x64/build/Release/NMiner.node ./bin/nminer-win32-x64.node
          cp temp/addon-linux-x64/build/Release/NMiner.node ./bin/nminer-linux-x64.node
          cp temp/addon-linux-arm64/build/Release/NMiner.node ./bin/nminer-linux-arm64.node

          zip -r nminer-win32-x64.zip bin/nminer-win32-x64.node src/js/*.js index.js index.d.ts src/js/*.d.ts package.json LICENSE
          tar -czvf nminer-linux-x64.tar.gz bin/nminer-linux-x64.node src/js/*.js index.js index.d.ts src/js/*.d.ts package.json LICENSE
          tar -czvf nminer-linux-arm64.tar.gz bin/nminer-linux-arm64.node src/js/*.js index.js index.d.ts src/js/*.d.ts package.json LICENSE

          if [ -f temp/addon-win32-arm64/build/Release/NMiner.node ]; then
            cp temp/addon-win32-arm64/build/Release/NMiner.node ./bin/nminer-win32-arm64.node
            zip -r nminer-win32-arm64.zip bin/nminer-win32-arm64.node src/js/*.js index.js index.d.ts src/js/*.d.ts package.json LICENSE
          fi

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release to GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: NMiner v${{ steps.pkg.outputs.version }}
          draft: true
          prerelease: false
          files: |
            nminer-win32-*.zip
            nminer-linux-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}